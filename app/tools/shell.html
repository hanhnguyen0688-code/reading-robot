<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1c45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reading Robot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*ROBOT_CSS*/

/* ===================== app shell additions ===================== */
html,body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#home .brand{position:absolute;left:66px;top:56px}
#home .teacher{position:absolute;right:56px;top:56px;display:flex;gap:16px}
#home .teacher button{font-size:28px;padding:14px 26px}
#home .robot{left:70px;top:330px;transform:scale(.85);transform-origin:top left}
#home .hello{position:absolute;left:740px;top:210px;right:60px}
#home .hello h1{font-size:96px;font-weight:900;letter-spacing:-2px;line-height:1}
#home .hello p{font-size:34px;color:#c9c6e6;margin-top:16px}
#home .tiles{position:absolute;left:740px;right:60px;top:440px;bottom:60px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-content:start;padding:8px 8px 20px 4px;user-select:none}
#home .tiles::-webkit-scrollbar{width:0}
.kid{display:flex;align-items:center;gap:26px;min-width:0;background:var(--panel2);border:4px solid #4a4b62;border-radius:40px;padding:22px 28px 22px 22px;text-align:left;
  box-shadow:0 10px 0 rgba(0,0,0,.3);transition:transform .12s,border-color .2s}
.kid:active{transform:translateY(5px);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.kid:focus-visible{outline:none;border-color:var(--violet)}
.kid .av{flex:none;width:104px;height:104px;border-radius:32px;display:grid;place-items:center;font-size:54px;font-weight:900;color:#1b1640;
  background:linear-gradient(180deg,#d3cbff,#9384f2);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.kid b{display:block;font-size:48px;font-weight:800;line-height:1.05}
.kid small{display:block;font-size:26px;color:#aeabc9;margin-top:6px;font-weight:600}
.kid .meta{min-width:0}
.kid .meta small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{position:absolute;left:740px;right:60px;bottom:60px;background:#3b2440;border:3px solid #ff9fb2;color:#ffd9e1;border-radius:30px;padding:24px 30px;font-size:28px;font-weight:600;line-height:1.35}
#stage .err{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:#3b2440;border:3px solid #ff9fb2;color:#ffe3ea;border-radius:30px;padding:22px 34px;font-size:30px;font-weight:700;z-index:9;max-width:88%;text-align:center}
#sleep{cursor:pointer}
#sleep .tap{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:34px;font-weight:700;color:#bdb6f2}

#stage.portrait #home .brand{left:40px;top:44px}
#stage.portrait #home .teacher{right:40px;top:44px}
#stage.portrait #home .robot{left:390px;top:150px;transform:scale(.45)}
#stage.portrait #home .hello{left:40px;right:40px;top:500px;text-align:center}
#stage.portrait #home .hello h1{font-size:88px}
#stage.portrait #home .tiles{left:40px;right:40px;top:720px;bottom:50px;grid-template-columns:1fr}
#stage.portrait #home .warn{left:40px;right:40px;bottom:50px}

/* ---------- PIN pad (normal page UI, outside the scaled stage) ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,8,20,.72);display:grid;place-items:center;z-index:30;padding:16px}
.overlay[hidden]{display:none}
.pinbox{background:#26273a;color:#f1effb;border:1px solid #3d3e57;border-radius:22px;padding:22px;width:min(340px,100%);text-align:center;font-family:inherit}
.pinbox h2{font-size:20px;margin-bottom:6px}.pinbox p{color:#a9a6c6;font-size:14px;margin-bottom:14px}
.pindots{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid #8f82f0}.pindots i.f{background:#a99cf5}
.pinbox.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:#34354d;border-radius:14px;padding:16px 0;font-size:22px;font-weight:700;color:#fff}
.keys button:active{background:#4a4b6a}
.pinbox .cancel{margin-top:14px;color:#c7c3e6;font-size:15px;padding:8px}

/* ---------- teacher area ---------- */
#admin{position:fixed;inset:0;z-index:25;background:#16151f;color:#efedf9;overflow:auto;user-select:text;font-size:15px;line-height:1.5;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#admin[hidden]{display:none}
#admin .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto 14px}
#admin .bar h1{font-size:20px;font-weight:800;margin-right:auto}
#admin .tabs{display:flex;gap:6px;flex-wrap:wrap}
#admin .tabs button{padding:8px 14px;border-radius:999px;background:#25243a;color:#c9c6e6;font-weight:600}
#admin .tabs button.on{background:#a99cf5;color:#1b1640}
#aBody{max-width:1180px;margin:0 auto}
#admin .muted{color:#9c99b6}#admin .nowrap{white-space:nowrap}
#admin .empty{color:#9c99b6;padding:40px 10px;text-align:center}
#admin h2{font-size:20px;font-weight:800}
#admin h3{font-size:12px;font-weight:700;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:#9c99b6}
.ab{background:#2d2c44;color:#efedf9;border-radius:10px;padding:9px 14px;font-weight:600;border:1px solid #3c3a58;font-size:14px}
.ab.primary{background:#a99cf5;color:#1b1640;border-color:#a99cf5}
.ab.danger{color:#ff9fb2;border-color:#5b3346;background:transparent}
.filebtn{position:relative;overflow:hidden;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.rlayout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}
@media(max-width:820px){.rlayout{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:6px;background:#1f1e2c;border:1px solid #2f2d42;border-radius:14px;padding:8px;max-height:75vh;overflow:auto}
@media(max-width:820px){.rlist{max-height:240px}}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;text-align:left;border:1px solid transparent;width:100%}
.item:hover,.item.on{background:#2c2848}.item.on{border-color:#a99cf5}
.item b{display:block}.item small{color:#9c99b6;font-size:12px}
.rdetail{background:#1f1e2c;border:1px solid #2f2d42;border-radius:14px;padding:16px;min-width:0}
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.band{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;align-self:center}
.band.independent{background:#14352a;color:#5fd6a4}.band.instructional{background:#3a2c12;color:#f2c063}.band.frustration{background:#3d1a25;color:#ff8fa8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid #2f2d42;border-radius:12px;padding:10px 12px}
.kpi small{color:#9c99b6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}.kpi span{color:#9c99b6;font-size:12px}
.note{background:#2c2848;border-radius:12px;padding:12px 14px}
.rr{font-size:19px;line-height:2.1}
#admin .w{padding:1px 3px;border-radius:5px;position:relative;display:inline}
#admin .w.substitution{background:#3d1a25;color:#ff8fa8;text-decoration:line-through}
#admin .w.omission{background:#3d1a25;color:#ff8fa8;opacity:.75;text-decoration:line-through dotted}
#admin .w.told{background:#123333;color:#6fe0d6;font-weight:700}
#admin .w.pending{color:#6c6a86}
#admin .w.flag{border-bottom:3px dotted #f2c063}
#admin .w sup{font-size:10px;font-weight:700;color:#a99cf5;margin-left:1px}
#admin .w .said{position:absolute;left:0;top:-15px;font-size:11px;color:#ff8fa8;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#9c99b6;margin-top:8px}
.chip{display:inline-block;background:#2c2848;color:#c4baff;padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px;margin:2px}
.tablewrap{overflow-x:auto}
#admin table{width:100%;border-collapse:collapse;font-size:14px}
#admin th,#admin td{text-align:left;padding:7px 8px;border-bottom:1px solid #2f2d42}#admin th{color:#9c99b6;font-size:11px;text-transform:uppercase}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#1f1e2c;border:1px solid #2f2d42;border-radius:12px;padding:10px}
.row input,.row select,.pform input,.pform select,.pform textarea{background:#16151f;color:#efedf9;border:1px solid #3c3a58;border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
.row input{flex:1 1 120px}.row select{flex:1 1 180px}
.pcard{background:#1f1e2c;border:1px solid #2f2d42;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.pcard summary{cursor:pointer;padding:4px 0}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#c9c6e6}
.pform label.check{flex-direction:row;align-items:center;gap:8px}
.pform .full{grid-column:1/-1}
.mictest{background:#16151f;border:1px dashed #4a4866;border-radius:10px;padding:12px;font-size:17px;min-height:48px}
#aToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#a99cf5;color:#1b1640;font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:40;pointer-events:none}
#aToast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!--STAGE-->

<!--HOME_SECTION-->
  <section class="screen on" id="home">
    <div class="pill brand"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="6" width="16" height="13" rx="4"/><rect x="11" y="2" width="2" height="4"/><circle cx="9" cy="12" r="1.6" fill="#c6bcff"/><circle cx="15" cy="12" r="1.6" fill="#c6bcff"/><rect x="9" y="15" width="6" height="1.6" rx=".8" fill="#c6bcff"/></svg></span>Reading Robot</div>
    <div class="teacher"><button class="pill" id="teacherBtn" aria-label="Teacher area">Teacher</button></div>
    <div class="robot blink" id="robotH"></div>
    <div class="hello"><h1>Who's reading today?</h1><p>Tap your name to start.</p></div>
    <div class="tiles" id="kids"></div>
    <div class="warn" id="homeWarn" hidden></div>
  </section>
<!--/HOME_SECTION-->

<div class="overlay" id="pin" hidden>
  <div class="pinbox" id="pinBox" role="dialog" aria-labelledby="pinTitle">
    <h2 id="pinTitle">Teacher area</h2><p>Enter the teacher PIN</p>
    <div class="pindots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="pinKeys"></div>
    <button class="cancel" id="pinCancel">Cancel</button>
  </div>
</div>

<div id="admin" hidden>
  <div class="bar"><h1>Reading Robot · Teacher</h1>
    <div class="tabs"><button data-tab="reports" class="on">Reports</button><button data-tab="students">Students</button><button data-tab="passages">Passages</button><button data-tab="settings">Settings</button></div>
    <button class="ab primary" id="aClose">Back to robot</button></div>
  <div id="aBody"></div>
</div>
<div id="aToast" role="status"></div>

<script src="engine.js"></script>
<script src="store.js"></script>
<script src="speech.js"></script>
<script src="session.js"></script>
<script src="admin.js"></script>
<script>
/*RENDERER*/

/* ======================= STANDALONE APP ======================= */
const MODE = 'app';
let session = null;
function log(){}                                     // no debug console in the app
function fit(){
  const st=$('#stage'); const portrait = innerHeight > innerWidth*1.15;
  st.classList.toggle('portrait', portrait);
  const W=portrait?1080:1920, H=portrait?1920:1240, pad=portrait?16:28;
  st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/(W+pad), innerHeight/(H+pad))})`;
}
function applyMarksClass(){ $('#txt').parentElement.classList.toggle('marks-on', !!RRStore.settings.showErrorsLive); }
function napCountdown(sec){
  clearInterval(napTimer); let left=sec; const total=sec;
  const tick=()=>{ $('#napN').textContent=Math.max(0,left-1); $('#napTxt').textContent=`Robot nap in ${Math.max(0,left-1)}s...`;
    $('#napArc').setAttribute('stroke-dashoffset', 201*(1-(left-1)/total)); if(--left<=0) clearInterval(napTimer); };
  tick(); napTimer=setInterval(tick, 1000);
}
function rpc(method){ if(session) session.rpc(method); }

$('#robotH').innerHTML = robotHTML();
const sleepTap=document.createElement('div'); sleepTap.className='tap'; sleepTap.textContent='Tap to wake me up'; $('#sleep').appendChild(sleepTap);

function appHandle(ev){
  if(ev.type==='error'){ showError(ev.text); return; }
  if(ev.type==='report_sent'){ $('#tSent').textContent = `${ev.teacher} ✓`; return; }
  handle(ev);
}
let errT; function showError(text){
  let el=$('#stage .err'); if(!el){ el=document.createElement('div'); el.className='err'; $('#stage').appendChild(el); }
  el.textContent=text; el.hidden=false; clearTimeout(errT); errT=setTimeout(()=>{ el.hidden=true; }, 7000);
  if(session){ session.end('error'); }
}

function renderHome(){
  const kids=RRStore.students();
  $('#kids').innerHTML = kids.length ? kids.map(s=>{
    const p=RRStore.passage(s.passage_id);
    return `<button class="kid" data-id="${esc(s.id)}"><span class="av">${esc((s.name||'?')[0].toUpperCase())}</span><span class="meta"><b>${esc(s.name)}</b><small>${esc(s.year||'')}${p?` · ${p.mission!=null?'Mission '+esc(String(p.mission))+' · ':''}${esc(p.title)}`:' · no passage'}</small></span></button>`;
  }).join('') : `<div class="warn" style="position:static">No students yet. Tap Teacher to add your class.</div>`;
  $('#kids').querySelectorAll('.kid').forEach(b=>b.onclick=()=>startFor(b.dataset.id));
  const w=$('#homeWarn');
  if(!RRSpeech.available()){ w.hidden=false; w.textContent='This browser cannot recognise speech. Open the app in Chrome on Android, or install the Reading Robot Android app.'; }
  else if(!window.isSecureContext){ w.hidden=false; w.textContent='The microphone needs a secure page. Open the app over https:// .'; }
  else w.hidden=true;
}

let wakeLock=null;
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }

function startFor(id){
  const s=RRStore.student(id); if(!s) return;
  const p=RRStore.passage(s.passage_id);
  if(!p){ showError(`${s.name} has no passage yet. Ask your teacher to pick one.`); return; }
  if(!RRSpeech.available()){ renderHome(); return; }
  RRSpeech.TTS.unlock(); keepAwake();
  UI.done=false;
  session = new RRSession({ student: {...s}, passage: p, settings: {...RRStore.settings}, emit: appHandle,
    onDone: reason => { setTimeout(()=>{ if($('#sleep').classList.contains('on') || reason!=='complete') goHome(); }, reason==='complete'?4000:1500); } });
  session.start();
}
function goHome(){ session=null; renderHome(); show('home'); try{ wakeLock && wakeLock.release(); }catch(e){} }

$('#byeBtn').onclick = () => { if(session) session.end('bye'); };
$('#sleep').addEventListener('click', goHome);

/* ---------- teacher PIN ---------- */
let pinBuf='';
function openPin(){ pinBuf=''; drawPin(); $('#pin').hidden=false; }
function drawPin(){ $('#pinDots').innerHTML = Array.from({length:Math.max(4,RRStore.settings.teacherPin.length)},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join(''); }
$('#pinKeys').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button data-k="${k}">${k}</button>`:'<span></span>').join('');
$('#pinKeys').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k; if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else pinBuf+=k; drawPin();
  const pin=RRStore.settings.teacherPin;
  if(pinBuf.length>=pin.length){
    if(pinBuf===pin){ $('#pin').hidden=true; RRAdmin.open(()=>renderHome()); }
    else { const box=$('#pinBox'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); pinBuf=''; setTimeout(drawPin,350); }
  }
});
$('#pinCancel').onclick=()=>{ $('#pin').hidden=true; };
$('#teacherBtn').onclick=openPin;

renderHome(); show('home');
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};   // load voice list early
if('serviceWorker' in navigator && !window.RRNative && /^https:|localhost|127\.0\.0\.1/.test(location.origin)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
