<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1d1b2e;--dim:#6b6884;--line:#e6e3f2;--acc:#6d5fd6;--acc2:#efecff;
  --ok:#1f9d6b;--okbg:#e3f6ee;--mid:#b7791f;--midbg:#fdf3e1;--bad:#c53a5a;--badbg:#fde8ee;--told:#0f8a8a;--toldbg:#dff5f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15141f;--card:#1f1e2c;--ink:#efedf9;--dim:#9c99b6;--line:#2f2d42;--acc:#a99cf5;--acc2:#2c2848;
  --okbg:#14352a;--midbg:#3a2c12;--badbg:#3d1a25;--toldbg:#123333}}
:root[data-theme="dark"]{--bg:#15141f;--card:#1f1e2c;--ink:#efedf9;--dim:#9c99b6;--line:#2f2d42;--acc:#a99cf5;--acc2:#2c2848;--okbg:#14352a;--midbg:#3a2c12;--badbg:#3d1a25;--toldbg:#123333}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:22px;font-weight:800}
header .sub{color:var(--dim)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.list{display:flex;flex-direction:column;gap:6px;padding:8px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;color:inherit;font:inherit;width:100%}
.item:hover{background:var(--acc2)}.item.on{background:var(--acc2);border-color:var(--acc)}
.item b{display:block}.item small{color:var(--dim)}
.band{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:center}
.band.independent{background:var(--okbg);color:var(--ok)}.band.instructional{background:var(--midbg);color:var(--mid)}.band.frustration{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.kpi span{color:var(--dim);font-size:12px}
h2{font-size:20px;font-weight:800}h3{font-size:14px;font-weight:700;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.note{background:var(--acc2);border-radius:12px;padding:14px 16px;line-height:1.6}
.passage{font-size:20px;line-height:2.1}
.w{padding:1px 3px;border-radius:5px;position:relative}
.w.substitution{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.w.omission{background:var(--badbg);color:var(--bad);opacity:.75;text-decoration:line-through dotted}
.w.told{background:var(--toldbg);color:var(--told);font-weight:700}
.w.pending{color:var(--dim);opacity:.5}
.w.flag{border-bottom:3px dotted var(--mid)}
.w sup{font-size:11px;font-weight:700;color:var(--acc);margin-left:1px}
.w .said{position:absolute;left:0;top:-15px;font-size:11px;color:var(--bad);font-weight:700;white-space:nowrap;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase}
.empty{color:var(--dim);padding:30px;text-align:center}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px;margin:2px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Reading Robot · Reports</h1><span class="sub" id="cls">Class reports, newest first</span></header>
  <div class="layout">
    <div class="card list" id="list"><div class="empty">Loading…</div></div>
    <div class="card" id="detail"><div class="empty">Choose a report</div></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BAND={independent:'Independent ≥95%',instructional:'Instructional 90–94%',frustration:'Frustration <90%'};
const TYPE={substitution:'Substitution',omission:'Omission',told:'Told (asked for help)',insertion:'Insertion',self_correction:'Self-correction',
  sounded_out:'Sounded out',repetition:'Repetition',hesitation:'Hesitation',pronunciation:'Pronunciation to practise'};
let reports=[];
async function load(){
  const inline=document.getElementById('reports-data');
  if(inline && inline.textContent.trim().length>2) reports=JSON.parse(inline.textContent);
  else { try{ reports=await (await fetch('/api/reports')).json(); }catch{ reports=[]; } }
  renderList(); if(reports.length) select(0);
}
function renderList(){
  $('#list').innerHTML = reports.length ? reports.map((r,i)=>`<button class="item" data-i="${i}"><span><b>${esc(r.student_name)}</b><small>${esc(r.passage_title)} · ${new Date(r.created_at).toLocaleString()}</small></span><span class="band ${r.accuracy_band}">${r.accuracy_pct}%</span></button>`).join('')
    : '<div class="empty">No reports yet. They appear here when a child finishes reading.</div>';
  $('#list').querySelectorAll('.item').forEach(b=>b.onclick=()=>select(+b.dataset.i));
}
function select(i){
  $('#list').querySelectorAll('.item').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const r=reports[i];
  const flags={}; (r.miscues||[]).forEach(m=>{ (flags[m.index]=flags[m.index]||[]).push(m.type); });
  const passage=r.words.map(w=>{
    const f=flags[w.i]||[]; const cls=['w',w.status==='correct'?'':w.status, (w.lowpron||w.so||w.hes)?'flag':''].join(' ');
    const sup=[w.sc?'SC':'', w.rep?'R':'', w.hes?'⏸':''].filter(Boolean).join(' ');
    const said=w.status==='substitution'&&w.said?`<span class="said">${esc(w.said)}</span>`:'';
    const tip=[...new Set(f.map(t=>TYPE[t]))].join(', ')+(w.said&&w.status==='substitution'?` — said “${w.said}”`:'')+(w.acc!=null?` · pron ${Math.round(w.acc)}/100`:'')+(w.hes?` · paused ${w.hes}s`:'');
    return `<span class="${cls}" title="${esc(tip)}">${said}${esc(w.w)}${sup?`<sup>${sup}</sup>`:''}</span>`;
  }).join(' ');
  const rows=(r.miscues||[]).filter(m=>!['repetition'].includes(m.type)).map(m=>`<tr><td>${m.index+1}</td><td>${esc(m.word||'—')}</td><td>${TYPE[m.type]||m.type}</td><td>${esc(m.said||'')}</td><td>${esc(m.detail||'')}</td></tr>`).join('');
  $('#detail').innerHTML=`
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h2>${esc(r.student_name)} <span style="color:var(--dim);font-weight:500">· ${esc(r.year)}</span></h2>
      <div style="color:var(--dim)">${esc(r.passage_title)} · Level ${esc(r.level)} · ${esc(r.finished_reason)} · ASR: ${esc(r.asr_backend)}</div></div>
      <span class="band ${r.accuracy_band}" style="font-size:14px">${BAND[r.accuracy_band]}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Accuracy</small><b>${r.accuracy_pct}%</b><span>${r.words_attempted-r.errors}/${r.words_attempted} words · error rate ${r.error_rate}</span></div>
      <div class="kpi"><small>WCPM</small><b>${r.wcpm??'—'}</b><span>${r.reading_seconds}s reading · pace ${String(r.pace).replace('_',' ')}</span></div>
      <div class="kpi"><small>Errors</small><b>${r.errors}</b><span>sub / omit / told / insert</span></div>
      <div class="kpi"><small>Self-corrections</small><b>${r.self_corrections}</b><span>SC rate ${r.sc_rate??'—'}</span></div>
      <div class="kpi"><small>Completion</small><b>${r.completion_pct}%</b><span>of ${r.total_words} words</span></div>
    </div>
    <h3>Teacher note</h3><div class="note">${esc(r.teacher_note||'—')}</div>
    <h3>Running record</h3><div class="passage">${passage}</div>
    <div class="legend"><span><span class="w substitution">word</span> substitution</span><span><span class="w omission">word</span> omission</span><span><span class="w told">word</span> told</span><span><span class="w flag">word</span> practise</span><span>SC self-correction · R repetition · ⏸ hesitation</span></div>
    <h3>Practice words</h3><div>${(r.practice_words||[]).map(w=>`<span class="pill">${esc(w)}</span>`).join('')||'—'}</div>
    <h3>Miscues</h3><table><thead><tr><th>#</th><th>Word</th><th>Type</th><th>Said</th><th>Detail</th></tr></thead><tbody>${rows||'<tr><td colspan=5>None</td></tr>'}</tbody></table>`;
}
load();
</script>
<script id="reports-data" type="application/json"></script>
</body>
</html>
