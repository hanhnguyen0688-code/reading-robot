# Installs the app on an Android emulator and runs the full reading flow (ReadingFlowTest),
# then publishes the screenshots to the "ci-screens" release so they can be reviewed.
name: Android emulator test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with: { path: vosk-model, key: vosk-model-small-en-us-0.15 }
      - name: Bundle the offline model
        run: |
          if [ ! -d vosk-model/vosk-model-small-en-us-0.15 ]; then
            mkdir -p vosk-model && curl -sSL -o vosk-model/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            (cd vosk-model && unzip -q m.zip && rm m.zip)
          fi
          A=android/app/src/main/assets/model-en-us
          rm -rf $A && mkdir -p $A && cp -r vosk-model/vosk-model-small-en-us-0.15/. $A/ && echo "vosk-model-small-en-us-0.15" > $A/uuid
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties && chmod +x android/gradlew
      - name: Run the reading flow on an emulator (tablet size)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || (mkdir -p ../screens && adb pull /sdcard/Download ../screens/ ; adb logcat -d -t 400 > ../screens/logcat.txt ; exit 1)
            mkdir -p ../screens && adb pull /sdcard/Download ../screens/
            ./gradlew --no-daemon assembleRelease
            bash ../.github/scripts/release-smoke.sh app/build/outputs/apk/release/app-x86_64-release.apk ../screens
      - name: Collect results
        if: always()
        run: |
          mkdir -p screens && find screens -name "*.png" -exec mv {} screens/ \; 2>/dev/null || true
          for f in android/app/build/outputs/androidTest-results/connected/debug/*.xml android/app/build/outputs/androidTest-results/connected/*.xml; do [ -f "$f" ] && cp "$f" screens/; done || true
          ls -la screens || true
      - name: Publish screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-screens
          name: Emulator test screenshots
          body: "Screenshots from the latest emulator run of ReadingFlowTest (${{ github.sha }})."
          files: |
            screens/*.png
            screens/release-logcat.txt
            screens/*.xml
            screens/logcat.txt
          prerelease: true
