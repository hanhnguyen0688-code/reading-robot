# Publishes the app/ folder to GitHub Pages so it opens in Chrome on any Android tablet (HTTPS, mic allowed).
name: Publish web app
# Run manually after turning on Settings > Pages > Source: GitHub Actions
# (GitHub Pages needs a public repo, or a paid plan for private repos).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deploy
        uses: actions/deploy-pages@v4
