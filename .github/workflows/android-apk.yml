# Builds the native Reading Robot app (Kotlin + Jetpack Compose) on every push:
# runs the engine unit tests (must match the Python engine), bundles the offline Vosk model,
# and publishes the APK as the "latest" release.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline speech model (Vosk, English small)
        uses: actions/cache@v4
        with: { path: vosk-model, key: vosk-model-small-en-us-0.15 }
      - name: Bundle the model into the app
        run: |
          if [ ! -d vosk-model/vosk-model-small-en-us-0.15 ]; then
            mkdir -p vosk-model && curl -sSL -o vosk-model/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            (cd vosk-model && unzip -q m.zip && rm m.zip)
          fi
          A=android/app/src/main/assets/model-en-us
          rm -rf $A && mkdir -p $A && cp -r vosk-model/vosk-model-small-en-us-0.15/. $A/
          echo "vosk-model-small-en-us-0.15" > $A/uuid
          du -sh $A
      - name: Unit tests + build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../ReadingRobot-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ../ReadingRobot-armv7.apk
          ls -la ../ReadingRobot-*.apk
      - name: Test report
        if: always()
        run: |
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"; done || true
      - uses: actions/upload-artifact@v4
        with: { name: ReadingRobot-apk, path: "ReadingRobot-*.apk" }
      - name: Remove the old single-file APK from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete-asset latest ReadingRobot.apk -y -R "${{ github.repository }}" || true
      - name: Publish as release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reading Robot (latest build)
          body: "Native Android app (Kotlin + Compose) with offline speech recognition. Most tablets: ReadingRobot-arm64.apk. Older 32-bit devices: ReadingRobot-armv7.apk. Built from ${{ github.sha }}."
          files: ReadingRobot-*.apk
          make_latest: true
