# Builds the Reading Robot APK on every push and publishes it as a downloadable release ("latest").
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties   # GitHub's Ubuntu runners ship the Android SDK
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ReadingRobot.apk
      - uses: actions/upload-artifact@v4
        with: { name: ReadingRobot-apk, path: ReadingRobot.apk }
      - name: Publish as release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reading Robot (latest build)
          body: "Tải ReadingRobot.apk trên máy Android, mở file và cho phép cài đặt. Bản build từ commit ${{ github.sha }}."
          files: ReadingRobot.apk
          make_latest: true
